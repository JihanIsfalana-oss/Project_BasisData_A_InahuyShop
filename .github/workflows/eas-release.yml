name: Expo production builds

on:
  workflow_dispatch:
    inputs:
      app:
        description: Expo app to build
        required: true
        type: choice
        options:
          - customer-mobile
          - admin-mobile
        default: customer-mobile
      platform:
        description: Native platform
        required: true
        type: choice
        options:
          - all
          - android
          - ios
        default: all

permissions:
  contents: read

concurrency:
  group: eas-production-${{ inputs.app }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      BUILD_PLATFORM: ${{ inputs.platform }}
      APP_NAME: ${{ inputs.app }}
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Require Expo token and HTTPS API URL
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required in the production environment." >&2
            exit 1
          fi
          case "$EXPO_PUBLIC_API_BASE_URL" in
            https://*/api/v1) ;;
            *)
              echo "Set EXPO_PUBLIC_API_BASE_URL to the production HTTPS API base ending in /api/v1." >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require linked Expo project and native identifiers
        run: |
          cd "apps/$APP_NAME"
          pnpm exec expo config --type public --json | node -e '
            let input = ""
            process.stdin.on("data", (chunk) => input += chunk)
            process.stdin.on("end", () => {
              const config = JSON.parse(input)
              const missing = []
              if (!config.extra?.eas?.projectId) missing.push("extra.eas.projectId")
              if (!config.android?.package) missing.push("android.package")
              if (!config.ios?.bundleIdentifier) missing.push("ios.bundleIdentifier")
              if (missing.length) {
                console.error(`Configure ${missing.join(", ")} before building.`)
                process.exitCode = 1
              }
            })
          '

      - name: Build with Expo
        run: |
          cd "apps/$APP_NAME"
          pnpm dlx eas-cli@27.11.0 build --platform "$BUILD_PLATFORM" --profile production --non-interactive
