services:
  api:
    image: inahuyshop-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env and configure it}
      MYSQL_USER: ${MYSQL_USER:?Copy .env.example to .env and configure it}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env and configure it}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and configure it}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
